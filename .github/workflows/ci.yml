name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # qmllint is not on the runner and Quickshell's types are not
      # resolvable there anyway; tests/run.sh skips it when absent.
      - name: Run the test suite
        run: ./tests/run.sh
