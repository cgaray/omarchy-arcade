name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # jq and shellcheck are preinstalled on GitHub's ubuntu runners, so the
      # workflow needs no package installs (and carries no sudo). qmllint is
      # not on the runner and Quickshell's types are not resolvable there
      # anyway; tests/run.sh skips it when absent.
      - name: Run the test suite
        run: ./tests/run.sh
